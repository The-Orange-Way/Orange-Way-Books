<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Content Security Policy
      ───────────────────────
      Applied via <meta http-equiv> so it ships with the static HTML even on
      hosting platforms that don't let us set response headers. A hosting-
      level CSP HTTP header is still preferred in production and should
      match or tighten these rules.

      script-src:    'self' for our bundle. 'unsafe-inline' covers Vite's
                     dev-tool injection in preview builds. Remove for prod
                     if you ship precompiled hashes. 'wasm-unsafe-eval'
                     allows WebAssembly compilation — required by hash-wasm
                     for Argon2id in the vault unlock + OrangeRails sync flows.
      style-src:     Google Fonts loads stylesheets from fonts.googleapis.com;
                     Tailwind emits inline <style> tags, so 'unsafe-inline'
                     is required.
      font-src:      Google Fonts + data: URIs (icons).
      connect-src:   Supabase REST/Auth/Edge + WebSocket + CoinGecko & OXR
                     only via edge functions, so no direct entry needed.
                     PostHog EU endpoints added for product analytics.
      img-src:       'self' + blob/data for CSV/print workflows.
      object-src 'none' + base-uri 'self' close classic injection vectors.

      Note: frame-ancestors is intentionally NOT set here. The CSP spec
      requires browsers to ignore frame-ancestors when delivered via a
      <meta> element, and Chromium emits a console warning to that
      effect. The canonical frame-ancestors directive lives in
      public/_headers (delivered as a real HTTP response header by
      Cloudflare Pages), which is where browsers actually honor it.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://eu-assets.i.posthog.com https://challenges.cloudflare.com https://support.orangeway.app;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://challenges.cloudflare.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: blob: https://eu.i.posthog.com https://support.orangeway.app;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co https://eu.i.posthog.com https://eu-assets.i.posthog.com https://challenges.cloudflare.com https://support.orangeway.app wss://support.orangeway.app https://pulse.orangeway.app;
      frame-src https://challenges.cloudflare.com https://support.orangeway.app;
      base-uri 'self';
      form-action 'self';
      object-src 'none';
    "
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>Orange Way Books — Zero-Knowledge Bitcoin Accounting</title>
    <meta
      name="description"
      content="Open-source, zero-knowledge accounting for Bitcoin businesses. Encrypted on your device. Double-entry. IFRS &amp; GAAP. Free."
    />
    <link rel="canonical" href="https://books.orangeway.app/" />
    <meta name="author" content="Orange Way Books" />

    <!-- Favicons & app icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0B1220" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Orange Way Books" />
    <meta property="og:url" content="https://books.orangeway.app/" />
    <meta property="og:title" content="Orange Way Books — Zero-Knowledge Bitcoin Accounting" />
    <meta
      property="og:description"
      content="Open-source, zero-knowledge accounting for Bitcoin businesses. Encrypted on your device. Double-entry. IFRS &amp; GAAP. Free."
    />
    <meta property="og:image" content="https://books.orangeway.app/og/default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Orange Way Books — Zero-Knowledge Bitcoin Accounting" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Orange Way Books — Zero-Knowledge Bitcoin Accounting" />
    <meta
      name="twitter:description"
      content="Open-source, zero-knowledge accounting for Bitcoin businesses. Encrypted on your device. Double-entry. IFRS &amp; GAAP. Free."
    />
    <meta name="twitter:image" content="https://books.orangeway.app/og/default.png" />

    <!-- AI / LLM crawler hints -->
    <link rel="alternate" type="text/plain" href="/llms.txt" title="LLM-friendly site index" />
    <link
      rel="alternate"
      type="text/plain"
      href="/llms-full.txt"
      title="LLM-friendly full content"
    />

    <!--
      Default JSON-LD structured data + AI-readable summary shipped in the
      static HTML so non-JS crawlers (most AI bots) see machine-readable
      identity even before React mounts. Per-page <Seo /> components add
      page-specific schema (FAQPage, BreadcrumbList, Review, etc.).
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://books.orangeway.app/#organization",
            "name": "Orange Way Books",
            "url": "https://books.orangeway.app",
            "logo": "https://books.orangeway.app/icon-512.png",
            "sameAs": ["https://github.com/The-Orange-Way/Orange-Way-Books"]
          },
          {
            "@type": "WebSite",
            "@id": "https://books.orangeway.app/#website",
            "url": "https://books.orangeway.app",
            "name": "Orange Way Books",
            "publisher": { "@id": "https://books.orangeway.app/#organization" },
            "description": "Open-source, zero-knowledge accounting platform for Bitcoin businesses."
          },
          {
            "@type": "SoftwareApplication",
            "name": "Orange Way Books",
            "applicationCategory": "BusinessApplication",
            "applicationSubCategory": "AccountingApplication",
            "operatingSystem": "Web",
            "url": "https://books.orangeway.app",
            "description": "Open-source, zero-knowledge, double-entry accounting for Bitcoin businesses. Argon2id + AES-GCM client-side encryption. IFRS & US GAAP. Multi-currency BTC and fiat with historical FX. Apache-2.0.",
            "license": "https://www.apache.org/licenses/LICENSE-2.0",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD",
              "description": "Free for individuals. Free to self-host."
            },
            "featureList": [
              "Zero-knowledge end-to-end encryption (Argon2id + AES-GCM)",
              "Bitcoin-native multi-currency ledger (sats / BTC / fiat)",
              "Double-entry bookkeeping (legacy ledger backend engine)",
              "IFRS and US GAAP frameworks",
              "Capability-based role-based access control",
              "Multi-organization with envelope encryption",
              "Post-quantum signing keys (ML-DSA-65)",
              "Full data takeout export",
              "CSV import/export",
              "Open source under Apache-2.0"
            ]
          }
        ]
      }
    </script>

    <!-- Inline splash styles. Rendered before any external resource so the
         loading frame appears instantly while the JS bundle downloads. -->
    <style>
      #ow-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b1220;
        color: #ededed;
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        z-index: 9999;
        transition: opacity 280ms ease;
      }
      #ow-splash.ow-splash-leaving {
        opacity: 0;
        pointer-events: none;
      }
      .ow-splash-inner {
        text-align: center;
        max-width: 22rem;
        padding: 0 1.5rem;
      }
      .ow-splash-glyph {
        display: inline-block;
        margin-bottom: 1.25rem;
        animation: ow-splash-spin 1.6s linear infinite;
      }
      @keyframes ow-splash-spin {
        from { transform: rotate(0); }
        to { transform: rotate(360deg); }
      }
      .ow-splash-title {
        font-size: 1.0625rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
        letter-spacing: -0.01em;
      }
      .ow-splash-sub {
        font-size: 0.875rem;
        color: #a1a1a1;
        margin: 0;
        line-height: 1.5;
      }
      @media (prefers-reduced-motion: reduce) {
        .ow-splash-glyph { animation: none; }
      }
    </style>
  </head>

  <body>
    <!-- Pre-hydration splash. Shown instantly while the JS bundle downloads
         and parses. Removed by src/main.tsx after React mounts. Each Orange
         Way product carries its own noun here: "books" for OWB, "wallet"
         for OWM. -->
    <div id="ow-splash" aria-hidden="true">
      <div class="ow-splash-inner">
        <div class="ow-splash-glyph" aria-hidden="true">
          <svg
            width="48"
            height="48"
            viewBox="0 0 48 48"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <circle
              cx="24"
              cy="24"
              r="20"
              stroke="#f7931a"
              stroke-width="3"
              stroke-linecap="round"
              stroke-dasharray="40 80"
            />
          </svg>
        </div>
        <div class="ow-splash-text">
          <p class="ow-splash-title">Securing your session</p>
          <p class="ow-splash-sub">
            Your books are encrypted in this browser before anything leaves your device.
          </p>
        </div>
      </div>
    </div>

    <div id="root">
      <!--
        Pre-hydration AI-readable fallback. JS-enabled visitors never see
        this (React replaces #root on mount). AI crawlers and search bots
        that don't execute JS read this content as the page body.
      -->
      <noscript>
        <h1>Orange Way Books — Zero-Knowledge Bitcoin Accounting</h1>
        <p>
          Orange Way Books is the open-source, zero-knowledge accounting platform built for Bitcoin
          businesses. Your books are encrypted on your device with a vault password before being
          uploaded; the server stores only ciphertext. Apache-2.0 licensed.
        </p>
        <p>
          Please enable JavaScript to use the application, or visit the public marketing pages:
          <a href="/features">Features</a>, <a href="/security">Security</a>,
          <a href="/pricing">Pricing</a>, <a href="/faq">FAQ</a>, <a href="/compare">Compare</a>,
          <a href="/docs">Docs</a>.
        </p>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Chatwoot live chat -->
    <script>
      (function (d, t) {
        var BASE_URL = 'https://support.orangeway.app';
        var g = d.createElement(t),
          s = d.getElementsByTagName(t)[0];
        g.src = BASE_URL + '/packs/js/sdk.js';
        g.defer = true;
        g.async = true;
        s.parentNode.insertBefore(g, s);
        g.onload = function () {
          window.chatwootSDK.run({
            websiteToken: 'DDeepTdV9PqTVJs4H3ZhZccw',
            baseUrl: BASE_URL,
          });
        };
      })(document, 'script');
    </script>
  </body>
</html>
