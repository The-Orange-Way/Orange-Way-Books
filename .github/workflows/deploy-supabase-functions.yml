# OPTIONAL: Deploy Supabase Edge Functions from GitHub.
#
# Managed-cloud projects
# ------------------------
# If Supabase is provisioned by a managed-cloud platform, you usually do NOT see that project
# under your personal Supabase org (e.g. dashboard shows zero projects). In
# that case you cannot add SUPABASE_ACCESS_TOKEN here — deploy Edge Functions
# from that platform instead (Cloud → Edge Functions, or use the platform deploy UI
# everything under supabase/functions/).
#
# Self-hosted / org-owned Supabase
# ---------------------------------
# If YOU control the same Supabase project as this repo, add GitHub secrets:
#   SUPABASE_ACCESS_TOKEN  — https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   — ref from URL, e.g. dvobnnkuyztabapttapc
# Then run this workflow manually (Actions → Deploy Supabase Edge Functions → Run).
#
# This workflow is manual-only so managed-cloud repos do not get failing CI
# on every push under supabase/.
#
# The deploy matrix is discovered from supabase/functions at run time. Do not
# reintroduce a hand-written list: a function missing from it deploys nowhere
# and the run still passes.
#
# A secret's value cannot be read by a reviewer, so the run has to state its
# own target. Type the project ref you intend to deploy to into
# expected_project_ref: it is compared against the configured secret before
# any function is touched, and a mismatch stops the run. Neither value is
# printed. Use dry_run to answer "what does this deploy to" without deploying.

name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
    inputs:
      expected_project_ref:
        description: "Project ref to deploy to. Must match the secret."
        required: true
        type: string
      dry_run:
        description: "Check the target and stop, deploying nothing."
        required: false
        default: false
        type: boolean

concurrency:
  group: supabase-functions-deploy
  cancel-in-progress: false

# Minimum required permissions. The deploy uses Supabase access tokens via
# secrets; no GitHub state needs to be written.
permissions:
  contents: read

# Opt into Node 24 for GitHub's JS-action runtime — silences the Node 20
# deprecation banner on every run.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  assert-target:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run unless the configured target is the intended one
        env:
          EXPECTED: ${{ inputs.expected_project_ref }}
          CONFIGURED: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "$CONFIGURED" ]; then
            echo "::error::SUPABASE_PROJECT_REF is not configured. Nothing was deployed."
            exit 1
          fi
          if [ -z "$EXPECTED" ]; then
            echo "::error::expected_project_ref was empty. Nothing was deployed."
            exit 1
          fi
          # Neither value is echoed. Only the verdict is.
          if [ "$EXPECTED" != "$CONFIGURED" ]; then
            echo "::error::The configured project ref is not the one you asked for. Nothing was deployed. Fix the secret or the input and run again."
            exit 1
          fi
          echo "Target confirmed: the configured secret matches the ref you supplied."

  discover:
    needs: assert-target
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.list.outputs.functions }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - uses: actions/checkout@v6

      - name: List every function under supabase/functions
        id: list
        run: |
          set -euo pipefail
          # A function is a directory holding an index.ts. _shared and other
          # helper directories carry no entrypoint and are skipped.
          mapfile -t names < <(
            find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -printf '%h\n' \
              | xargs -r -n1 basename \
              | sort
          )
          if [ "${#names[@]}" -eq 0 ]; then
            echo "::error::No deployable functions found under supabase/functions. Refusing to report success on an empty deploy."
            exit 1
          fi
          printf 'Found %s function(s):\n' "${#names[@]}"
          printf '  %s\n' "${names[@]}"
          json=$(printf '%s\n' "${names[@]}" | jq -R . | jq -sc .)
          echo "functions=$json" >> "$GITHUB_OUTPUT"
          echo "count=${#names[@]}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        function: ${{ fromJSON(needs.discover.outputs.functions) }}

    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy ${{ matrix.function }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF repository secrets."
            echo "If this project is managed by a cloud platform, deploy Edge Functions from that platform instead (see workflow header comments)."
            exit 1
          fi
          # --use-api: server-side bundle. Laptop-local bundling hangs
          # indefinitely on these projects; --use-api bundles on Supabase's
          # build infra in seconds.
          supabase functions deploy "${{ matrix.function }}" --use-api --project-ref "$SUPABASE_PROJECT_REF"

  report:
    needs: [discover, deploy]
    if: always() && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - name: Say how many functions were deployed
        run: |
          echo "Discovered ${{ needs.discover.outputs.count }} function(s); deploy result: ${{ needs.deploy.result }}"
          if [ "${{ needs.deploy.result }}" != "success" ]; then
            echo "::error::At least one function failed to deploy. Treat the set as partially deployed."
            exit 1
          fi
