# OPTIONAL: Deploy Supabase Edge Functions from GitHub.
#
# Managed-cloud projects
# ------------------------
# If Supabase is provisioned by a managed-cloud platform, you usually do NOT see that project
# under your personal Supabase org (e.g. dashboard shows zero projects). In
# that case you cannot add SUPABASE_ACCESS_TOKEN here — deploy Edge Functions
# from that platform instead (Cloud → Edge Functions, or use the platform deploy UI
# everything under supabase/functions/).
#
# Self-hosted / org-owned Supabase
# ---------------------------------
# If YOU control the same Supabase project as this repo, add GitHub secrets:
#   SUPABASE_ACCESS_TOKEN  — https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   — ref from URL, e.g. dvobnnkuyztabapttapc
# Then run this workflow manually (Actions → Deploy Supabase Edge Functions → Run).
#
# This workflow is manual-only so managed-cloud repos do not get failing CI
# on every push under supabase/.

name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:

concurrency:
  group: supabase-functions-deploy
  cancel-in-progress: false

# Minimum required permissions. The deploy uses Supabase access tokens via
# secrets; no GitHub state needs to be written.
permissions:
  contents: read

# Opt into Node 24 for GitHub's JS-action runtime — silences the Node 20
# deprecation banner on every run.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        function:
          - exchange-rate-fetch
          - invite-org-member
          - lookup-user-profiles
          - owb-or-proxy
          - or-webhook-receiver

    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy ${{ matrix.function }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF repository secrets."
            echo "If this project is managed by a cloud platform, deploy Edge Functions from that platform instead (see workflow header comments)."
            exit 1
          fi
          # --use-api: server-side bundle. Laptop-local bundling hangs
          # indefinitely on these projects; --use-api bundles on Supabase's
          # build infra in seconds.
          supabase functions deploy "${{ matrix.function }}" --use-api --project-ref "$SUPABASE_PROJECT_REF"
