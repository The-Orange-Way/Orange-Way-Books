name: Deploy to Cloudflare Pages

on:
  push:
    branches: [dev, prod]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Minimum required permissions. The deploy uses Cloudflare API tokens via
# secrets; no GitHub state needs to be written.
permissions:
  contents: read

# Opt into Node 24 for GitHub's JS-action runtime — silences the Node 20
# deprecation banner on every run.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    # Hotfix branches (hotfix/prod-*) target the prod environment so
    # vars.VITE_* resolve to the prod values; otherwise the build ships
    # without Supabase env and the prod bundle dies on first load.
    environment: ${{ startsWith(github.ref_name, 'hotfix/prod-') && 'prod' || github.ref_name }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_ORBI_SUPABASE_URL: ${{ vars.VITE_ORBI_SUPABASE_URL }}
          VITE_ORBI_SUPABASE_ANON_KEY: ${{ vars.VITE_ORBI_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_DEPLOY_ENV: ${{ github.ref_name }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          # Onboarding v2 (DL-0429) is a build-time flag, read as the exact
          # string "true" in onboarding-flow.tsx. It is NOT a Cloudflare Pages
          # env var: the bundle is built here, in Actions, then shipped to
          # Pages, so the value must be present at this Build step.
          #
          # On for dev only. The reason it was off on every branch was that v2
          # authenticated and then provisioned nothing, no org and no vault, so
          # a user who finished it was left stuck with no way back in. That is
          # fixed: #226 persists the five vault columns v2 was discarding, and
          # #227 shows and verifies the real recovery words instead of accepting
          # any twelve strings. Both must be merged before this lands, which is
          # why this PR is sequenced behind them rather than opened alongside.
          #
          # Prod stays 'false' deliberately. Turning it on for real customers is
          # a separate decision that belongs to whoever owns the release, taken
          # after the flow has been exercised on books.orangeway.dev. Flipping
          # both at once would mean prod's first run of v2 is also its first
          # test of v2.
          VITE_ONBOARDING_V2: ${{ github.ref_name == 'dev' && 'true' || 'false' }}
          # Branch-derived Turnstile site key. Site keys are browser-safe
          # by design; the corresponding secret lives on the Supabase Auth
          # config (security_captcha_secret), not on the SPA.
          #
          # Non-prod builds ship Cloudflare's published always-passes test
          # site key rather than a live one. That is not a shortcut, it is
          # what makes automation possible at all. The end-to-end fixture
          # provisioner signs in through a real browser against the deployed
          # dev site, and a live key cannot be solved headlessly, so the
          # submit control stays disabled and the run dies on a navigation
          # timeout with no request and no console error to explain it.
          # The sibling app resolved the same problem the same way.
          #
          # Prod keeps the live key. Only the prod project has the captcha
          # switch on, and only a real challenge should satisfy it.
          VITE_TURNSTILE_SITE_KEY: ${{ (github.ref_name == 'prod' || startsWith(github.ref_name, 'hotfix/prod-')) && vars.TURNSTILE_SITE_KEY_PROD || '1x00000000000000000000AA' }}

      - name: Pick Pages project for this branch
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "prod" ] || [[ "${{ github.ref_name }}" == hotfix/prod-* ]]; then
            echo "project=owb-prod" >> "$GITHUB_OUTPUT"
            echo "verify_url=https://books.orangeway.app" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "dev" ]; then
            echo "project=owb-dev" >> "$GITHUB_OUTPUT"
            echo "verify_url=https://books.orangeway.dev" >> "$GITHUB_OUTPUT"
          else
            echo "Unknown branch ${{ github.ref_name }} — skipping deploy"
            exit 0
          fi

      - name: Pick wrangler branch tag (must match CF Pages production branch)
        id: cfbranch
        run: |
          if [ "${{ steps.target.outputs.project }}" = "owb-prod" ]; then
            echo "branch=prod" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to ${{ steps.target.outputs.project }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler@4.92.0 pages deploy dist \
            --project-name=${{ steps.target.outputs.project }} \
            --branch=${{ steps.cfbranch.outputs.branch }} \
            --commit-dirty=true

      - name: Verify deploy
        run: |
          sleep 8
          ROUTES=$(curl -s ${{ steps.target.outputs.verify_url }} | grep -oE '/assets/routes-[^"]*\.js' | head -1 || true)
          if [ -z "$ROUTES" ]; then
            echo "::warning::Could not find routes chunk on ${{ steps.target.outputs.verify_url }} — custom domain may not be wired yet"
            exit 0
          fi
          curl -s "${{ steps.target.outputs.verify_url }}${ROUTES}" >/dev/null
          echo "✓ ${{ steps.target.outputs.verify_url }} routes chunk fetched OK"
