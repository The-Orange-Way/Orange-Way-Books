name: No auto-merge guard

# Arming auto-merge is not a merge path on this repo. The builder does not
# press merge; the Auditor approves; the CTO or Release merges. That rule
# has never covered ARMING an automatic merge, and pull-requests:write is
# enough to do it. This workflow makes the gap a recorded refusal instead
# of a silent one.
#
# The one sanctioned exception is the prod-to-dev back-merge automation
# (see .github/workflows/prod-backmerge.yml). That PR carries no new work,
# only history, and landing it mechanically is correct.
#
# pull_request_target, not pull_request: this repo is public, and a fork's
# pull_request run gets a read-only token that cannot disarm anything. This
# job needs no checkout of PR head code at any point, and must never add one.

on:
  pull_request_target:
    types: [auto_merge_enabled]

permissions:
  contents: read
  pull-requests: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether this is the sanctioned back-merge
        id: check
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # Keep this in sync with BACKMERGE_BRANCH in prod-backmerge.yml.
          BACKMERGE_BRANCH="automation/backmerge-prod-to-dev"
          if [ "${HEAD_REF}" = "${BACKMERGE_BRANCH}" ]; then
            echo "sanctioned=true" >> "${GITHUB_OUTPUT}"
          else
            echo "sanctioned=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Require FLEET_PAT
        if: steps.check.outputs.sanctioned == 'false'
        env:
          FLEET_PAT: ${{ secrets.FLEET_PAT }}
        run: |
          if [ -z "${FLEET_PAT:-}" ]; then
            echo "::error title=FLEET_PAT is not set::Auto-merge was armed on this PR and cannot be disarmed because FLEET_PAT is missing. Failing loudly instead of leaving it armed silently."
            echo "### FLEET_PAT is missing" >> "${GITHUB_STEP_SUMMARY}"
            echo "Auto-merge was armed on this PR and this workflow cannot disarm it without a repository secret named FLEET_PAT. Disarm it by hand: gh pr merge --disable-auto <PR>." >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          echo "FLEET_PAT is present."

      - name: Disarm auto-merge and fail
        if: steps.check.outputs.sanctioned == 'false'
        env:
          GH_TOKEN: ${{ secrets.FLEET_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTOR: ${{ github.event.sender.login }}
          REPO: ${{ github.repository }}
        run: |
          gh pr merge --disable-auto "${PR_NUMBER}" --repo "${REPO}" || \
            echo "::warning title=Disable auto-merge call failed::gh pr merge --disable-auto did not succeed; check whether FLEET_PAT can write pull-requests on this repo."

          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "Arming auto-merge is not a merge path on this repo. Auto-merge armed by @${ACTOR} has been disarmed. Once the Auditor approves this PR, hand the merge to the CTO or to Release with the PR number and head sha; the reviewer does not merge either." || true

          {
            echo "### Auto-merge disarmed"
            echo ""
            echo "Armed by: \`${ACTOR}\`"
            echo ""
            echo "Arming auto-merge is not a merge path on this repo. This PR should be merged by a seat, once the Auditor has approved it."
          } >> "${GITHUB_STEP_SUMMARY}"

          exit 1

      - name: Sanctioned back-merge, no action taken
        if: steps.check.outputs.sanctioned == 'true'
        run: |
          echo "Head branch is the sanctioned prod-to-dev back-merge automation branch. Auto-merge left armed." >> "${GITHUB_STEP_SUMMARY}"
