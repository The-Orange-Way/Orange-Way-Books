name: backmerge-run

# One-shot back-merge of prod into dev for DL-0723. Triggered by the push of
# this file to ops/backmerge-run (a builder credential push, so it fires; the
# runner GITHUB_TOKEN push to ops/backmerge-result below fires nothing, which
# is intended). Delete this branch after ops/backmerge-result is merged.
on:
  push:
    branches: [ops/backmerge-run]

permissions:
  contents: write

jobs:
  backmerge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: back-merge prod into dev, dev content wins, assert, then push
        run: |
          set -euo pipefail
          git config user.name "backmerge-bot"
          git config user.email "backmerge-bot@users.noreply.github.com"

          git fetch --no-tags origin \
            +refs/heads/dev:refs/remotes/origin/dev \
            +refs/heads/prod:refs/remotes/origin/prod

          git checkout -B ops/backmerge-result origin/dev
          git merge -s ours origin/prod \
            -m "backmerge(prod into dev): carry the prod tip into dev ancestry, dev tree wins entirely"

          # 1. two parents, or it is not a merge commit at all
          git rev-parse -q --verify HEAD^2 >/dev/null || { echo "FAIL: not a merge commit"; exit 1; }

          # 2. prod is genuinely in the ancestry, which is the entire point
          git merge-base --is-ancestor origin/prod HEAD || { echo "FAIL: prod not an ancestor"; exit 1; }

          # 3. a back-merge moves ancestry, not content. With -s ours the tree is byte
          #    identical to dev, so ANY diff is a defect: STOP and post, do not push.
          CHANGED="$(git diff --name-only origin/dev HEAD)"
          [ -z "$CHANGED" ] || { printf 'FAIL: tree differs from dev:\n%s\n' "$CHANGED"; exit 1; }

          git push origin ops/backmerge-result
