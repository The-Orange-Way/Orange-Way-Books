name: Post-merge identity + leak scan

# Scans every commit that just landed on a protected branch for
# reserved-term strings in:
#   - commit message body (Co-authored-by trailers, body text)
#   - author name + email
#   - committer name + email
#
# This catches the class of leak the pre-push gate cannot see: GitHub
# auto-adds Co-authored-by trailers to squash / rebase merge commits at
# merge time, and the trailer email comes from each contributor's local
# git config. If a contributor's user.email contains an internal-only
# string, the merge commit silently carries that string into public
# history.
#
# The pre-push gate at scripts/pre-push-gate.sh blocks the same class of
# leak at push time on the contributor's laptop, but only if the gate is
# installed. This workflow is the server-side belt to that suspenders.

on:
  push:
    branches: [dev, prod]

# This job only reads history and greps commits; it writes nothing to
# GitHub state. Pin the token to read-only instead of inheriting the
# repository default scope.
permissions:
  contents: read

jobs:
  identity-scan:
    name: Identity + body scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history of the just-pushed commits
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch both protected branches for range exclusion
        run: git fetch origin dev prod --no-tags

      - name: Determine range to scan
        id: range
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          # On a brand-new branch creation, github.event.before is a SHA of
          # all zeros. Scan only the head commit in that case to avoid
          # scanning the entire repo history every time a new branch lands.
          ZERO="0000000000000000000000000000000000000000"
          if [ "$BEFORE" = "$ZERO" ]; then
            echo "range=$AFTER -1" >> "$GITHUB_OUTPUT"
          else
            # Exclude commits already reachable from the other protected branch.
            # This prevents back-merge commits (prod->dev or dev->prod) from
            # re-scanning the entire merged ancestry that was already checked when
            # it first landed on the source branch. The merge commit itself is
            # always new on the receiving branch and is always included.
            if [ "${{ github.ref_name }}" = "dev" ]; then
              if ! git rev-parse --verify origin/prod >/dev/null 2>&1; then
                echo "::error::origin/prod does not resolve after fetch; cannot compute exclusion range."
                exit 1
              fi
              echo "range=$BEFORE..$AFTER ^origin/prod" >> "$GITHUB_OUTPUT"
            else
              if ! git rev-parse --verify origin/dev >/dev/null 2>&1; then
                echo "::error::origin/dev does not resolve after fetch; cannot compute exclusion range."
                exit 1
              fi
              echo "range=$BEFORE..$AFTER ^origin/dev" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Scan author + committer + body for reserved-term patterns
        env:
          # The reserved-term list is NOT hardcoded here: committing it
          # would publish the very strings it exists to keep out of the
          # public repo. It lives in the OW_RESERVED_TERMS repository
          # secret; scripts/pre-push-gate.sh and pre-publish-scan.sh source
          # the same list locally (env var or gitignored .reserved-terms),
          # so local and server-side enforcement cannot drift.
          RAW_PATTERN: ${{ secrets.OW_RESERVED_TERMS }}
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -uo pipefail
          if [ -z "$RAW_PATTERN" ]; then
            echo "::error::OW_RESERVED_TERMS repository secret is not set; the identity scan cannot run."
            exit 1
          fi

          # Canonicalize through the SHARED implementation, not a copy of
          # it. See scripts/canon-terms.sh: it drops blank and comment
          # lines, deletes carriage returns, joins the rest into one regex
          # alternation and trims stray separators. The copy that used to
          # live here was missing the carriage-return step, so a secret
          # saved with Windows line endings produced a pattern of dead
          # branches while this step printed a term count and "clean".
          if [ ! -f scripts/canon-terms.sh ]; then
            echo "::error::scripts/canon-terms.sh is missing, so the reserved-term list cannot be canonicalized. This scan must not report clean when it could not run."
            exit 1
          fi
          . scripts/canon-terms.sh
          PATTERN="$(printf '%s\n' "$RAW_PATTERN" | canon_terms)"

          if [ -z "$PATTERN" ]; then
            echo "::error::OW_RESERVED_TERMS is set but contains no usable terms after dropping comments and blank lines."
            exit 1
          fi
          # Non-empty is not the same as usable. Each line of the stored
          # value is a regex FRAGMENT, so an unbalanced parenthesis or
          # bracket is a realistic typo. grep exits 2 on a pattern it
          # refuses, and the match below is an "if": exit 2 takes the same
          # false branch a clean line does, the counter stays at zero and
          # this step prints "Identity-scan clean" having compared nothing.
          if ! canon_terms_usable "$PATTERN"; then
            echo "::error::OW_RESERVED_TERMS does not compile as a regular expression, so this scan cannot run and must not report clean. At least one line is not valid regex; an unbalanced parenthesis or bracket is the usual cause. No part of the value is printed."
            exit 1
          fi
          # Count only. The terms themselves are never printed to a public log.
          TERM_COUNT=$(printf '%s' "$PATTERN" | tr '|' '\n' | grep -c .)
          echo "Reserved-term list loaded: $TERM_COUNT term(s)."

          echo "Walking range: $RANGE"
          # Collect commit metadata first; a non-zero exit means git could not
          # walk the range. An empty result from a failed walk must not be
          # reported as clean -- fail explicitly instead.
          COMMIT_DATA="$(git log $RANGE --format='%H AUTHOR %an <%ae> COMMITTER %cn <%ce>%n%B%n--END--')" \
            || { echo "::error::git log failed walking range '$RANGE'; the scan cannot run."; exit 1; }

          COMMIT_COUNT=$(printf '%s\n' "$COMMIT_DATA" | grep -c '^[0-9a-f]\{40\} AUTHOR' || true)
          echo "Commits in range: $COMMIT_COUNT"

          MATCHES=0
          if [ "$COMMIT_COUNT" -gt 0 ]; then
            # GitHub auto-injects a "Co-authored-by: <name> <noreply@anthropic.com>"
            # trailer on squash/rebase merge commits. That address is Anthropic's
            # public GitHub integration email and the trailer carries no
            # internal-only identifier, yet a publicly known model name can contain
            # a reserved-term substring and trip the scan. Drop ONLY that trailer
            # line before matching; author, committer, and the rest of the body
            # stay fully in scope so no other line gets a free pass.
            while IFS= read -r line; do
              if printf '%s' "$line" | grep -qEi "$PATTERN"; then
                echo "::error::Reserved-term pattern found in just-pushed commit metadata (redacted; see OW_RESERVED_TERMS)."
                MATCHES=$((MATCHES + 1))
              fi
            done < <(printf '%s\n' "$COMMIT_DATA" \
                     | grep -viE '^[[:space:]]*Co-authored-by:[[:space:]]*Claude[[:space:]]+[A-Za-z]+[[:space:]]+[0-9.]+[[:space:]]*<noreply@anthropic\.com>[[:space:]]*$')
          fi

          if [ "$MATCHES" -gt 0 ]; then
            echo "::error::Identity-scan failed: $MATCHES commit(s) carry reserved-term strings."
            exit 1
          fi
          echo "Identity-scan clean: scanned $COMMIT_COUNT commit(s), 0 reserved-term matches."

      - name: Run repo tree pre-publish leak scan (defense in depth)
        env:
          OW_RESERVED_TERMS: ${{ secrets.OW_RESERVED_TERMS }}
        run: |
          set -euo pipefail
          # Fail closed: an unrunnable scanner is a broken guard, not a
          # clean tree. If this step cannot execute the scanner it must go
          # red, never report a green it did not earn.
          if [ ! -x scripts/pre-publish-scan.sh ]; then
            echo "::error::scripts/pre-publish-scan.sh is missing or not executable; the tree scan cannot run."
            exit 1
          fi
          bash scripts/pre-publish-scan.sh
