name: Post-merge identity + leak scan

# Scans every commit that just landed on a protected branch for
# reserved-term strings in:
#   - commit message body (Co-authored-by trailers, body text)
#   - author name + email
#   - committer name + email
#
# This catches the class of leak the pre-push gate cannot see: GitHub
# auto-adds Co-authored-by trailers to squash / rebase merge commits at
# merge time, and the trailer email comes from each contributor's local
# git config. If a contributor's user.email contains an internal-only
# string, the merge commit silently carries that string into public
# history.
#
# The pre-push gate at scripts/pre-push-gate.sh blocks the same class of
# leak at push time on the contributor's laptop, but only if the gate is
# installed. This workflow is the server-side belt to that suspenders.

on:
  push:
    branches: [dev, prod]

jobs:
  identity-scan:
    name: Identity + body scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history of the just-pushed commits
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine range to scan
        id: range
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          # On a brand-new branch creation, github.event.before is a SHA of
          # all zeros. Scan only the head commit in that case to avoid
          # scanning the entire repo history every time a new branch lands.
          ZERO="0000000000000000000000000000000000000000"
          if [ "$BEFORE" = "$ZERO" ]; then
            echo "range=$AFTER -1" >> "$GITHUB_OUTPUT"
          else
            echo "range=$BEFORE..$AFTER" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan author + committer + body for reserved-term patterns
        env:
          # The reserved-term list is NOT hardcoded here: committing it
          # would publish the very strings it exists to keep out of the
          # public repo. It lives in the OW_RESERVED_TERMS repository
          # secret; scripts/pre-push-gate.sh and pre-publish-scan.sh source
          # the same list locally (env var or gitignored .reserved-terms),
          # so local and server-side enforcement cannot drift.
          RAW_PATTERN: ${{ secrets.OW_RESERVED_TERMS }}
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -uo pipefail
          if [ -z "$RAW_PATTERN" ]; then
            echo "::error::OW_RESERVED_TERMS repository secret is not set; the identity scan cannot run."
            exit 1
          fi

          # Canonicalize exactly as scripts/pre-publish-scan.sh does: drop
          # blank lines and #-comment lines, join the rest into one regex
          # alternation. Without this a comment line in the secret would be
          # compiled into the regex as a live fragment. A single-line
          # "a|b|c" secret passes through unchanged.
          PATTERN="$(printf '%s\n' "$RAW_PATTERN" \
            | grep -vE '^[[:space:]]*(#|$)' \
            | paste -sd'|' - \
            | sed -e 's/^|*//' -e 's/|*$//')"

          if [ -z "$PATTERN" ]; then
            echo "::error::OW_RESERVED_TERMS is set but contains no usable terms after dropping comments and blank lines."
            exit 1
          fi
          # Count only. The terms themselves are never printed to a public log.
          TERM_COUNT=$(printf '%s' "$PATTERN" | tr '|' '\n' | grep -c .)
          echo "Reserved-term list loaded: $TERM_COUNT term(s)."

          echo "Scanning range: $RANGE"
          MATCHES=0
          while IFS= read -r line; do
            if printf '%s' "$line" | grep -qEi "$PATTERN"; then
              echo "::error::Reserved-term pattern found in just-pushed commit metadata (redacted; see OW_RESERVED_TERMS)."
              MATCHES=$((MATCHES + 1))
            fi
          done < <(git log $RANGE --format='%H AUTHOR %an <%ae> COMMITTER %cn <%ce>%n%B%n--END--')

          if [ "$MATCHES" -gt 0 ]; then
            echo "::error::Identity-scan failed: $MATCHES commit(s) carry reserved-term strings."
            exit 1
          fi
          echo "Identity-scan clean: 0 commits carry reserved-term strings."

      - name: Run repo tree pre-publish leak scan (defense in depth)
        env:
          OW_RESERVED_TERMS: ${{ secrets.OW_RESERVED_TERMS }}
        run: |
          set -euo pipefail
          # Fail closed. A missing or non-executable scanner is a broken guard,
          # not a clean tree: if this step skipped, the run would report success
          # while scanning nothing. The identity step above fails the same way on
          # an absent or empty secret, so both guards in this workflow fail loud.
          if [ ! -x scripts/pre-publish-scan.sh ]; then
            echo "::error::scripts/pre-publish-scan.sh is missing or not executable; the tree scan cannot run."
            exit 1
          fi
          bash scripts/pre-publish-scan.sh
