name: Post-merge identity + leak scan

# Scans every commit that just landed on a protected branch for
# identity and structural leaks in:
#   - author email and committer email (allowlist approach)
#   - Tailscale FQDNs in any metadata field (structural check)
#   - commit message body (Tailscale FQDNs only; see trade-off note)
#
# The OW_RESERVED_TERMS blacklist is intentionally absent. It was
# retired from GitHub by founder ruling 2026-09-07 (it must not live as
# a public-repo secret). The blacklist now runs on our own boxes via the
# pre-push gate (scripts/pre-push-gate.sh reads .reserved-terms locally)
# and a scheduled scan that files findings into delivery-db without
# touching a public log.
#
# Trade-off (stated plainly, not hidden): allowlist checks catch email
# and hostname leaks well. They do not catch codenames or personal names
# in commit bodies, because those have no structural signature. The
# box-side scheduled scan covers that gap on a schedule.

on:
  push:
    branches: [dev, prod]

# This job only reads history and greps commits; it writes nothing to
# GitHub state. Pin the token to read-only instead of inheriting the
# repository default scope.
permissions:
  contents: read

jobs:
  identity-scan:
    name: Identity + body scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history of the just-pushed commits
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch both protected branches for range exclusion
        run: git fetch origin dev prod --no-tags

      - name: Determine range to scan
        id: range
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          ZERO="0000000000000000000000000000000000000000"
          if [ "$BEFORE" = "$ZERO" ]; then
            echo "range=$AFTER -1" >> "$GITHUB_OUTPUT"
          else
            if [ "${{ github.ref_name }}" = "dev" ]; then
              if ! git rev-parse --verify origin/prod >/dev/null 2>&1; then
                echo "::error::origin/prod does not resolve after fetch; cannot compute exclusion range."
                exit 1
              fi
              echo "range=$BEFORE..$AFTER ^origin/prod" >> "$GITHUB_OUTPUT"
            else
              if ! git rev-parse --verify origin/dev >/dev/null 2>&1; then
                echo "::error::origin/dev does not resolve after fetch; cannot compute exclusion range."
                exit 1
              fi
              echo "range=$BEFORE..$AFTER ^origin/dev" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Scan author and committer identity for non-public addresses
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -uo pipefail
          # PUBLIC-SAFE EMAIL DOMAIN ALLOWLIST.
          # Author and committer emails must match one of these domains.
          # Any other domain is either PII (personal email) or internal
          # infrastructure (a Tailscale FQDN in an email field was the
          # exact vector for 3 of the 7 commits that carried reserved terms).
          SAFE_EMAIL_RE='@(users\.noreply\.github\.com|github\.com|anthropic\.com|orangerails\.com)$'

          # STRUCTURAL TAILNET CHECK.
          # Tailscale FQDNs are always internal infrastructure. They are
          # identifiable by structure without any blacklist.
          TAILNET_RE='\.tail[0-9a-f]{6,}\.ts\.net'

          echo "Walking range: $RANGE"
          COMMIT_DATA="$(git log $RANGE \
            --format='%H AUTHOR %an <%ae> COMMITTER %cn <%ce>%n%B%n--END--')" \
            || { echo "::error::git log failed walking range '$RANGE'; the scan cannot run."; exit 1; }

          COMMIT_COUNT=$(printf '%s\n' "$COMMIT_DATA" \
            | grep -c '^[0-9a-f]\{40\} AUTHOR' || true)
          echo "Commits in range: $COMMIT_COUNT"

          FAILURES=0
          if [ "$COMMIT_COUNT" -gt 0 ]; then
            # EMAIL DOMAIN CHECK.
            while IFS= read -r header; do
              SHA=$(printf '%s' "$header" | cut -d' ' -f1)
              EMAILS=$(printf '%s' "$header" | grep -oE '<[^>]+>' | tr -d '<>')
              while IFS= read -r EMAIL; do
                [ -z "$EMAIL" ] && continue
                # Claude's noreply address is a public Anthropic integration;
                # allow it explicitly before the domain check.
                if printf '%s' "$EMAIL" | grep -qE '^noreply@anthropic\.com$'; then
                  continue
                fi
                if ! printf '%s' "$EMAIL" | grep -qE "$SAFE_EMAIL_RE"; then
                  echo "::error::Non-public email in commit ${SHA:0:8}: domain not on the allowlist (value redacted). Author and committer addresses must use a noreply or public-integration domain."
                  FAILURES=$((FAILURES + 1))
                fi
              done <<< "$EMAILS"
            done < <(printf '%s\n' "$COMMIT_DATA" | grep '^[0-9a-f]\{40\} AUTHOR')

            # TAILNET FQDN CHECK.
            TAILNET_HITS=$(printf '%s\n' "$COMMIT_DATA" \
              | grep -viE '^[[:space:]]*Co-authored-by:[[:space:]]*Claude[[:space:]]+[A-Za-z]+[[:space:]]+[0-9.]+[[:space:]]*<noreply@anthropic\.com>[[:space:]]*$' \
              | grep -cE "$TAILNET_RE" || true)
            if [ "$TAILNET_HITS" -gt 0 ]; then
              echo "::error::Tailscale FQDN (*.tailXXXXXX.ts.net) found in commit metadata: internal infrastructure name in public history."
              FAILURES=$((FAILURES + 1))
            fi
          fi

          if [ "$FAILURES" -gt 0 ]; then
            echo "::error::Identity-scan failed: $FAILURES violation(s) across $COMMIT_COUNT scanned commit(s)."
            exit 1
          fi
          echo "Identity-scan clean: $COMMIT_COUNT commit(s) scanned, 0 identity violations."

      - name: Run repo tree pre-publish leak scan (defense in depth)
        run: |
          set -euo pipefail
          if [ ! -x scripts/pre-publish-scan.sh ]; then
            echo "::error::scripts/pre-publish-scan.sh is missing or not executable; the tree scan cannot run."
            exit 1
          fi
          # OW_RESERVED_TERMS is intentionally absent: the blacklist is
          # retired from GitHub. pre-publish-scan.sh skips category 1
          # gracefully when no terms are configured, and runs the structural
          # checks (categories 2-3) as normal.
          bash scripts/pre-publish-scan.sh
