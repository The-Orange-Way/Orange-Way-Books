name: Leak check

on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-publish-scan:
    name: Pre-publish leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify the reserved-term list is configured
        # Trusted runs only: a push to a protected branch, or a PR from a
        # branch in this repository. Fork PRs never receive secrets, so the
        # value is expected to be empty there and the scan skips the
        # reserved-term category by design.
        #
        # On a trusted run an empty value means the list is not configured on
        # this repository, and the scan would report green while checking for
        # nothing. Fail loudly instead. The term count is printed; the terms
        # themselves never are.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          OW_RESERVED_TERMS: ${{ secrets.OW_RESERVED_TERMS }}
        run: |
          set -uo pipefail
          if [ -z "${OW_RESERVED_TERMS:-}" ]; then
            echo "::error::OW_RESERVED_TERMS is not configured on this repository. The reserved-term scan cannot run. Set it in Settings > Secrets and variables > Actions, one term per line."
            exit 1
          fi
          COUNT=$(printf '%s\n' "$OW_RESERVED_TERMS" | grep -cvE '^[[:space:]]*(#|$)' || true)
          echo "Reserved-term list is configured on this repository ($COUNT terms)."

      - name: Run pre-publish leak scan
        # Fails the job (and the required check) if any leak is found.
        # See scripts/pre-publish-scan.sh for the rules and exemptions.
        env:
          OW_RESERVED_TERMS: ${{ secrets.OW_RESERVED_TERMS }}
        run: bash scripts/pre-publish-scan.sh
