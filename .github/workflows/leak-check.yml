name: Leak check

on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-publish-scan:
    name: Pre-publish leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Reserved-term canonicalizer self test
        # Every consumer of the reserved-term list resolves it through one
        # shared function, so that function is a single point of failure
        # whose failure mode is silent: it returns a pattern that compiles,
        # matches nothing, and produces output identical to a clean tree.
        #
        # This needs no secret, so it runs on fork and Dependabot pull
        # requests too.
        run: bash scripts/test-canon-terms.sh

      - name: Run pre-publish leak scan
        # Fails the job (and the required check) if any leak is found.
        # See scripts/pre-publish-scan.sh for the rules and exemptions.
        #
        # OW_RESERVED_TERMS is intentionally absent here. The blacklist
        # was retired from GitHub (founder ruling 2026-09-07: the list must
        # not live as a public-repo secret). Without it, scripts/pre-publish-
        # scan.sh skips category 1 with a notice and runs the structural
        # checks (categories 2-3) as normal. The reserved-term blacklist
        # now runs exclusively via the pre-push gate on our boxes and a
        # scheduled scan that files findings into delivery-db.
        run: bash scripts/pre-publish-scan.sh
