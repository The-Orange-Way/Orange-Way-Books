name: CI

on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimum required permissions. Both jobs only read the repo + run scripts;
# nothing here writes to GitHub state.
permissions:
  contents: read

# Opt into Node 24 for GitHub's JS-action runtime (actions/cache@v4,
# actions/upload-artifact@v4, etc.). Default is Node 20, which GitHub is
# deprecating Sept 2026. Suppresses the deprecation banner on every run.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-build:
    name: Lint + test + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The project is managed with Bun (bun.lock, bunfig.toml).
      # The older workflow used `npm ci` which broke on every dep add
      # because Bun updates `bun.lock`, not package-lock.json.
      # `bun.lock` is the single source of truth.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Format check is enforced (no continue-on-error). After PR 0 lands the
      # tree is prettier-clean and the pre-commit hook keeps it that way, so
      # a red format check means someone committed without the hook
      # installed. The shell wrapper prints an actionable fix on failure
      # rather than leaving a contributor staring at "exit code 1".
      - name: Format check
        run: |
          if ! bun run format:check; then
            echo ""
            echo "::error::Prettier check failed. Run \`bun run format\` locally to fix, then commit. To never see this again on this clone, run \`bash scripts/install-hooks.sh\` once and every commit will auto-format its staged files."
            exit 1
          fi

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  e2e:
    name: E2E (Playwright smoke)
    runs-on: ubuntu-latest
    needs: lint-and-build
    # Bind to the dev environment scope so vars.VITE_SUPABASE_URL,
    # vars.VITE_SUPABASE_PROJECT_ID, etc. resolve to the dev values.
    # This job builds the app from the triggering ref and serves it on
    # loopback, so the specs exercise the code under review; the dev scope
    # supplies the Supabase vars that build needs, on prod pushes too.
    environment: dev
    # Runs on every push to dev or prod, AND on same-repo pull requests so a PR
    # that changes the E2E path can prove itself before merge. Fork PRs are
    # excluded by the head-repo check, so the dev service key in the `dev`
    # environment never reaches an untrusted runner. A ref gate cannot express
    # this: a PR run's ref is refs/pull/N/merge, so a refs/heads/dev check would
    # skip exactly the PR runs we want to prove. Specs target the locally
    # served build of the triggering ref (127.0.0.1:4173), not the live site.
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/prod'))
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build the app from THIS ref's code so the E2E suite exercises the code
      # under review, not the already-deployed dev site. The build needs the
      # dev Supabase vars because src/integrations/supabase/client.ts throws at
      # build time when VITE_SUPABASE_URL or VITE_SUPABASE_PUBLISHABLE_KEY are
      # unset; both resolve from the dev environment scope this job binds.
      - name: Build app under test
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # Serve the freshly built bundle on loopback and block until the port
      # answers. A preview that has not finished starting is the same timing
      # race in a new costume, so the health check is not optional: it fails
      # the job loudly if the server never comes up rather than letting every
      # spec strand at a connection error. nohup + & detaches the server so it
      # survives this step and stays up for the Playwright step.
      - name: Serve built app on 127.0.0.1:4173
        run: |
          nohup bunx vite preview --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173 > /dev/null 2>&1; then
              echo "preview is up on 127.0.0.1:4173"
              exit 0
            fi
            sleep 1
          done
          echo "::error::vite preview did not answer on 127.0.0.1:4173 within 30s"
          cat /tmp/vite-preview.log || true
          exit 1

      # Cache Playwright browser binaries between runs, saves ~25s of
      # `playwright install` per run on a cache hit.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lock') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bun run test:e2e:install

      # Runs the full tests/e2e/ directory: flash-flow narrative, the
      # owb-full-suite (auth + nav across every OWB surface), and the
      # OR import wizard spec. The wizard spec auto-skips when its
      # OWB_DEV_E2E_* env vars aren't set, so this is safe on forks /
      # external PRs that don't have the secrets.
      # Self-heal the E2E fixture before the specs run. The rls-isolation and
      # owb-full-suite specs sign in as a stable dev user; when that user is
      # wiped (project reset, data purge) every auth-dependent spec strands at
      # the login screen and the whole job goes red. This step idempotently
      # (re)creates the user and walks onboarding so the specs always have a
      # live fixture. DEV-only by a hard-coded ref allowlist in the script: it
      # pins the OWB DEV project ref as a literal and refuses to run against any
      # other ref, so a misconfigured URL cannot point it at prod.
      - name: Provision E2E user (DEV only)
        # Only materialize the DEV service key on trusted push events to dev or
        # prod. The e2e job still runs on same-repo pull requests (see the job
        # `if:` above) so a PR can prove E2E path changes, but provisioning is
        # skipped there, so the secret never reaches a runner built from an
        # unmerged branch. On PR runs the specs sign in against the existing dev
        # fixture; the self-heal that (re)creates it only runs post-merge.
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/prod')
        run: bun tests/e2e/scripts/provision-e2e-user.js
        env:
          OWB_E2E_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          OWB_E2E_SUPABASE_SECRET_KEY: ${{ secrets.OWB_E2E_SUPABASE_SECRET_KEY }}
          # Same fixture identity the specs sign in with, so provisioning and
          # the specs never drift onto two different users.
          OWB_DEV_E2E_EMAIL: ${{ secrets.OWB_DEV_E2E_EMAIL }}
          OWB_DEV_E2E_PASSWORD: ${{ secrets.OWB_DEV_E2E_PASSWORD }}
          OWB_DEV_E2E_VAULT_PASSWORD: ${{ secrets.OWB_DEV_E2E_VAULT_PASSWORD }}

      # tests/e2e/rls-cross-user.spec.ts (the real cross-tenant isolation
      # test: "user A cannot read user B's org data") used to file-scope skip
      # unless /tmp/owb-pw/owb-dev-supabase.json existed. Nothing wrote that
      # file in CI, so the spec was unconditionally skipped on every run.
      # Fixed at the source instead of by writing a service-key file here:
      # readSupaCreds() in the spec now falls back to the
      # OWB_E2E_SUPABASE_URL / OWB_E2E_SUPABASE_SECRET_KEY env vars the
      # "Run Playwright" step below already sets, so no file, and no
      # DEV service-role key on disk, is needed for the spec to run.

      - name: Run Playwright
        run: bunx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          OWB_DEV_E2E_EMAIL: ${{ secrets.OWB_DEV_E2E_EMAIL }}
          OWB_DEV_E2E_PASSWORD: ${{ secrets.OWB_DEV_E2E_PASSWORD }}
          OWB_DEV_E2E_VAULT_PASSWORD: ${{ secrets.OWB_DEV_E2E_VAULT_PASSWORD }}
          # Project-ref values that the e2e specs need to hit the live
          # dev Supabase project. Sourced from the same dev env-vars the
          # frontend build uses, so there is one place to rotate them.
          OWB_E2E_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          OWB_E2E_SUPABASE_SECRET_KEY: ${{ secrets.OWB_E2E_SUPABASE_SECRET_KEY }}
          OWB_E2E_ALLOWED_PROJECT_REFS: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
          OWB_E2E_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Held at '0' on every event. This previously read '1' on pushes to
          # dev and prod, and that one character is what has kept dev E2E red
          # since 2026-08-13.
          #
          # onboarding-walk.spec.ts deletes the SHARED e2e fixture user's
          # organizations in beforeAll, on purpose, so it can walk a fresh
          # signup. Its own walk then fails, so the org is never recreated, and
          # every spec that sorts after it (owb-full-suite B3 vault unlock,
          # rls-isolation) finds a user with no org and no vault. Provisioning
          # is skipped on pull_request runs, so nothing restores the fixture and
          # the next PR is red too, which is why no PR has been able to recover.
          #
          # The spec's own header already says "Skipped by default ... run
          # manually before promotes". Turning it on for automated pushes
          # contradicted that contract. This restores it.
          #
          # Re-enabling needs two things first: the walk must stop touching the
          # shared fixture (its own dedicated user), and its own failure must be
          # fixed. Until both land, running it costs three other specs.
          E2E_ONBOARDING_WALK: '0'

      # Two guards, one script, both reading the JSON report the run just wrote.
      #
      # DL-0779: a Playwright run that finds no tests, or only tests that skip
      # themselves, still exits 0, so the job goes green having verified
      # nothing. Fails unless at least one spec actually EXECUTED.
      #
      # OWB-T0094: that first check is suite-wide, so one spec answering "yes, I
      # ran" covers for every other spec, and any INDIVIDUAL spec can skip
      # itself forever with CI fully green. rls-cross-user.spec.ts did exactly
      # that from the day it was written until 2026-08-30, and nothing went red.
      # So every spec named in tests/e2e/required-specs.json must be observed
      # EXECUTING in this run, and a miss fails the job BY NAME with the likely
      # cause. Adding a spec to that list is one line in that file: no edit
      # here, and no edit to the script.
      #
      # A missing or unparseable report, and a missing or empty required list,
      # are failures in themselves and are never scored as a pass.
      - name: Guard that the suite, and every required spec, actually executed
        run: bun tests/e2e/scripts/assert-specs-ran.mjs playwright-report/results.json

      # Prove BOTH guards can go RED in this same run, so they are real gates
      # and not green rubber stamps. Each is fed a synthetic report of the exact
      # shape it exists to catch, and must exit non-zero. The required-spec
      # guard is then fed a report it must ACCEPT, because a check that is
      # permanently red is as useless as one that is permanently green.
      #
      # The required-spec cases supply their own throwaway list through
      # E2E_REQUIRED_SPECS_FILE, so this keeps proving the MECHANISM whatever
      # tests/e2e/required-specs.json happens to contain later.
      - name: Prove the spec-execution guards fire
        run: |
          set -euo pipefail

          # Case 1: nothing executed anywhere, so the suite-wide guard must fire.
          echo '{"stats":{"expected":0,"unexpected":0,"flaky":0,"skipped":3}}' > "$RUNNER_TEMP/zero-report.json"
          if bun tests/e2e/scripts/assert-specs-ran.mjs "$RUNNER_TEMP/zero-report.json"; then
            echo "::error::zero-spec guard did NOT fail on a zero-executed report"
            exit 1
          fi
          echo "zero-spec guard correctly failed on a zero-executed report"

          echo '{"required":["tests/e2e/proof-required.spec.ts"]}' > "$RUNNER_TEMP/proof-list.json"

          # Case 2: the suite ran, but a REQUIRED spec skipped. This is the hole
          # the suite-wide check cannot see, and the one rls-cross-user.spec.ts
          # sat in from the day it was written until 2026-08-30.
          echo '{"stats":{"expected":1,"unexpected":0,"flaky":0,"skipped":1},"suites":[{"title":"proof-required.spec.ts","file":"proof-required.spec.ts","specs":[{"title":"required thing","file":"proof-required.spec.ts","tests":[{"results":[{"status":"skipped"}]}]}]},{"title":"other.spec.ts","file":"other.spec.ts","specs":[{"title":"other thing","file":"other.spec.ts","tests":[{"results":[{"status":"passed"}]}]}]}]}' > "$RUNNER_TEMP/skipped-required-report.json"
          if E2E_REQUIRED_SPECS_FILE="$RUNNER_TEMP/proof-list.json" bun tests/e2e/scripts/assert-specs-ran.mjs "$RUNNER_TEMP/skipped-required-report.json" > "$RUNNER_TEMP/skipped-required-out.txt" 2>&1; then
            echo "::error::required-spec guard did NOT fail when a required spec skipped"
            cat "$RUNNER_TEMP/skipped-required-out.txt"
            exit 1
          fi
          # Being able to read the cause off the run page, without downloading
          # an artifact, is the whole reason for building it this way. So the
          # message naming the spec is part of the contract, not a nicety.
          if ! grep -q 'proof-required.spec.ts' "$RUNNER_TEMP/skipped-required-out.txt"; then
            echo "::error::required-spec guard failed but did not NAME the spec that skipped"
            cat "$RUNNER_TEMP/skipped-required-out.txt"
            exit 1
          fi
          echo "required-spec guard correctly failed BY NAME on a skipped required spec"

          # Case 3: the required spec executed, so the guard must PASS. Without
          # this we would only know it can complain, not that it is satisfiable.
          echo '{"stats":{"expected":1,"unexpected":0,"flaky":0,"skipped":0},"suites":[{"title":"proof-required.spec.ts","file":"proof-required.spec.ts","specs":[{"title":"required thing","file":"proof-required.spec.ts","tests":[{"results":[{"status":"passed"}]}]}]}]}' > "$RUNNER_TEMP/ran-required-report.json"
          E2E_REQUIRED_SPECS_FILE="$RUNNER_TEMP/proof-list.json" bun tests/e2e/scripts/assert-specs-ran.mjs "$RUNNER_TEMP/ran-required-report.json"
          echo "required-spec guard correctly passed when the required spec executed"

      # DL-0947: on a red E2E run, write the failing assertion label into the
      # run summary so it is readable on the run page without downloading and
      # unzipping the artifact. Pairs with the github reporter in
      # playwright.config.ts, which emits ::error:: annotations per failure.
      - name: Summarize E2E failures
        if: failure()
        run: bun tests/e2e/scripts/summarize-failures.mjs playwright-report/results.json

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            tests/e2e/__or-shots__/
          retention-days: 14

  deno-typecheck:
    name: Typecheck edge functions (Deno)
    runs-on: ubuntu-latest
    # Why this job exists: until 2026-07-26 CI never looked at supabase/functions
    # at all. Lint, test and build above all run over the Vite app; the edge
    # functions are Deno, with their own globals and URL/npm: imports, and no
    # step in this workflow ever loaded them. So all 22 functions could stop
    # compiling with CI still fully green -- and deploy-supabase-functions.yml
    # is workflow_dispatch-only, so nothing else caught it either.
    #
    # Gate design -- read this before changing it. This is a RATCHET, not a
    # wall: it fails only when the error count goes ABOVE the recorded
    # baseline. A plain `deno check` gate would go red on day one and block
    # every open PR in the repo; a `continue-on-error: true` advisory would
    # reproduce the exact blindness this job exists to end. The ratchet does
    # neither -- new type errors cannot land, the existing backlog is printed
    # in the job summary on every run, and the number only moves down.
    #
    # Making this check REQUIRED in the branch ruleset is a FOUNDER DECISION
    # and has deliberately NOT been done here. Nothing in this PR touches
    # branch protection.
    env:
      # Errors present on dev when this job was added, measured 2026-07-26 with
      # the pinned Deno below. Lower it in the same PR that fixes errors -- the
      # job prints the new value when the count drops. At 0, delete the ratchet
      # and let `deno check` fail on its own.
      DENO_CHECK_BASELINE: '15'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          # Pinned, not `latest`. These functions run on Supabase's edge
          # runtime, which the Supabase CLI provisions as edge-runtime v1.74.2
          # == deno 2.1.4; typecheck with the tsc the runtime actually ships.
          # Do not switch this to `latest`. A newer Deno bundles a newer tsc,
          # and a newer tsc reports a different set of diagnostics on an
          # unchanged tree -- it both adds and retires error classes. The
          # baseline below would then move for reasons unrelated to our code,
          # and the ratchet would go red on a Deno release rather than on a
          # code change. Bump the pin deliberately, in its own PR, and record
          # the new count in the same commit.
          deno-version: v2.1.4

      - name: deno check supabase/functions
        shell: bash
        env:
          # Deno colourises its diagnostics even when stdout+stderr are
          # redirected to a file on the runner. The first version of this step
          # counted "[ERROR]" fine but its per-class breakdown grepped for
          # 'TS1234 [ERROR]' and matched nothing, because the real bytes are
          # 'TS1234 <ESC>[0m[ERROR]'. Under `-e -o pipefail` that zero-match
          # grep killed the step, so the job went red while reporting exactly
          # the baseline count. NO_COLOR removes the escapes at the source; the
          # sed below strips them anyway, because a parser that only works when
          # the output happens to be plain is the same class of unreliable
          # control this job exists to replace.
          NO_COLOR: '1'
        run: |
          set -u

          # Scoped to the edge functions only. The rest of the repo is
          # Bun/Vite and is covered by the lint-and-build job.
          mapfile -t FILES < <(find supabase/functions -name '*.ts' -type f | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No .ts files found under supabase/functions -- this job is checking nothing. Fix the path rather than let it report green."
            exit 1
          fi
          echo "Checking ${#FILES[@]} file(s) with $(deno --version | head -1)"

          # --node-modules-dir=auto: the repo has a root package.json, so Deno
          # otherwise refuses npm: specifiers with "run deno install first".
          RC=0
          deno check --node-modules-dir=auto "${FILES[@]}" > "$RUNNER_TEMP/deno-check.raw" 2>&1 || RC=$?
          sed -e 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/deno-check.raw" > "$RUNNER_TEMP/deno-check.log"
          cat "$RUNNER_TEMP/deno-check.log"

          # One "[ERROR]" marker per diagnostic (the last is additionally
          # prefixed "error: "). Counting markers is stable; Deno's
          # "Found N errors." line is not printed when N == 1.
          ERRORS=$(grep -c '\[ERROR\]' "$RUNNER_TEMP/deno-check.log" || true)

          # A non-zero exit with no diagnostics means the check itself broke
          # (network, unresolvable import, bad flag). That must never be scored
          # as "0 errors, under baseline, pass" -- a check that silently stops
          # checking is the precise failure this job exists to eliminate.
          if [ "$RC" -ne 0 ] && [ "$ERRORS" -eq 0 ]; then
            echo "::error::deno check exited $RC without reporting any type diagnostic. The check is broken, not passing."
            exit 1
          fi

          {
            echo "## Deno typecheck: supabase/functions"
            echo
            echo "**${ERRORS} error(s)** across ${#FILES[@]} file(s) (ratchet baseline: ${DENO_CHECK_BASELINE})"
            if [ "$ERRORS" -gt 0 ]; then
              echo
              echo "By error class:"
              echo '```'
              grep -oE 'TS[0-9]+ \[ERROR\]' "$RUNNER_TEMP/deno-check.log" | sort | uniq -c | sort -rn || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "deno check: ${ERRORS} error(s); ratchet baseline ${DENO_CHECK_BASELINE}"

          if [ "$ERRORS" -gt "$DENO_CHECK_BASELINE" ]; then
            echo "::error::Edge-function type errors went UP: ${ERRORS} > baseline ${DENO_CHECK_BASELINE}. Fix the new errors listed above. Do not raise the baseline."
            exit 1
          fi

          if [ "$ERRORS" -lt "$DENO_CHECK_BASELINE" ]; then
            echo "::notice::Error count dropped to ${ERRORS}. Lower DENO_CHECK_BASELINE to ${ERRORS} in .github/workflows/ci.yml in this PR so the ratchet holds the ground you just took."
          fi

  frontend-typecheck:
    name: Typecheck frontend (tsc)
    runs-on: ubuntu-latest
    # Why this job exists: until DL-0782 CI never typechecked the Vite app.
    # lint-and-build runs format:check, lint, test and build; `build` is
    # `vite build`, and esbuild transpiles + strips types without checking
    # them. So the entire frontend could stop typechecking with CI fully
    # green, and 46 type errors sat on dev invisible to every passing PR.
    #
    # Gate design -- read this before changing it. Same RATCHET as
    # deno-typecheck above: it fails only when the error count goes ABOVE the
    # recorded baseline. A plain `tsc` gate would go red on day one and block
    # every open PR; a `continue-on-error: true` advisory would reproduce the
    # exact blindness this job exists to end. New type errors cannot land, the
    # existing backlog is printed in the job summary on every run, and the
    # number only moves down.
    #
    # Making this check REQUIRED in the branch ruleset is a FOUNDER DECISION
    # and has deliberately NOT been done here. Nothing in this PR touches
    # branch protection.
    #
    # Scope: tsconfig.app.json (the `src` tree), where the 46 errors live. The
    # repo-root tsconfig has files:[] and project references, so a bare
    # `tsc --noEmit` there checks nothing; and the referenced projects are not
    # `composite`, so `tsc -b` does not apply. Pointing tsc straight at the app
    # project is the invocation that actually sees the source.
    env:
      # Errors present on dev when this job was added (DL-0782). Lower it in
      # the same PR that fixes errors -- the job prints the new value when the
      # count drops. At 0, delete the ratchet and let `tsc` fail on its own.
      TSC_CHECK_BASELINE: '46'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: tsc --noEmit (frontend app)
        shell: bash
        env:
          # tsc colourises diagnostics; strip colour at the source so the
          # per-class grep below matches the real bytes, not escape-wrapped
          # ones. Same trap the deno job documents.
          NO_COLOR: '1'
        run: |
          set -u

          # Guard against checking nothing: the app project must resolve to
          # real source files, or a green result means nothing. This is the
          # silent-success shape the deno job also guards.
          FILE_COUNT=$(find src -type f \( -name '*.ts' -o -name '*.tsx' \) | wc -l | tr -d ' ')
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::No .ts/.tsx files found under src -- this job is checking nothing. Fix the path rather than let it report green."
            exit 1
          fi
          echo "Typechecking ${FILE_COUNT} source file(s) with tsc $(bunx tsc --version)"

          # --pretty false: deterministic one-line-per-diagnostic output on the
          # runner, so the marker count below is stable.
          RC=0
          bun run typecheck -- --pretty false > "$RUNNER_TEMP/tsc.log" 2>&1 || RC=$?
          cat "$RUNNER_TEMP/tsc.log"

          # One "error TSxxxx" token per diagnostic. The trailing
          # "Found N errors in M files." summary carries no "TS" token, so it
          # is not double-counted.
          ERRORS=$(grep -cE 'error TS[0-9]+' "$RUNNER_TEMP/tsc.log" || true)

          {
            echo "## Frontend typecheck: tsc --noEmit -p tsconfig.app.json"
            echo
            echo "**${ERRORS} error(s)** across ${FILE_COUNT} source file(s) (ratchet baseline: ${TSC_CHECK_BASELINE})"
            if [ "$ERRORS" -gt 0 ]; then
              echo
              echo "By error class:"
              echo '```'
              grep -oE 'error TS[0-9]+' "$RUNNER_TEMP/tsc.log" | sort | uniq -c | sort -rn || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Ratchet decision, extracted to scripts/tsc-ratchet.sh so the proof
          # step below drives the SAME guards with synthetic inputs. It prints
          # the count and runs the three RED branches: src resolves, tsc did not
          # silently break, and the count is not above baseline.
          bash scripts/tsc-ratchet.sh src "$RUNNER_TEMP/tsc.log" "$TSC_CHECK_BASELINE" "$RC"

      - name: Prove the tsc ratchet and its guards fire (DL-0782)
        shell: bash
        run: |
          # A ratchet nobody has watched go red is a green light with no bulb
          # behind it. Drive the SAME decision script through each RED branch
          # with synthetic inputs and assert every one exits non-zero. If any
          # guard ever stops failing, this step goes red instead, so the proof
          # is re-verified on every run rather than a one-off transient red.
          FAIL=0

          # Guard 1: an empty source tree means the check is checking nothing.
          EMPTY_DIR="$RUNNER_TEMP/empty-src"
          mkdir -p "$EMPTY_DIR"
          : > "$RUNNER_TEMP/tsc-empty.log"
          if bash scripts/tsc-ratchet.sh "$EMPTY_DIR" "$RUNNER_TEMP/tsc-empty.log" 46 0; then
            echo "::error::src-resolves guard did NOT fail on an empty source tree"
            FAIL=1
          fi

          # Guard 2: tsc exited non-zero but printed no diagnostic (it broke).
          : > "$RUNNER_TEMP/tsc-broken.log"
          if bash scripts/tsc-ratchet.sh src "$RUNNER_TEMP/tsc-broken.log" 46 2; then
            echo "::error::broken-check guard did NOT fail on a non-zero exit with zero diagnostics"
            FAIL=1
          fi

          # Guard 3: the ratchet, a diagnostic count above baseline.
          printf 'error TS0001: synthetic\nerror TS0002: synthetic\n' > "$RUNNER_TEMP/tsc-over.log"
          if bash scripts/tsc-ratchet.sh src "$RUNNER_TEMP/tsc-over.log" 1 0; then
            echo "::error::ratchet did NOT fail on a count (2) above baseline (1)"
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "tsc ratchet and both guards correctly went red on synthetic inputs"
