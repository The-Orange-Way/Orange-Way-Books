name: CI

on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimum required permissions. Both jobs only read the repo + run scripts;
# nothing here writes to GitHub state.
permissions:
  contents: read

# Opt into Node 24 for GitHub's JS-action runtime (actions/cache@v4,
# actions/upload-artifact@v4, etc.). Default is Node 20, which GitHub is
# deprecating Sept 2026. Suppresses the deprecation banner on every run.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-build:
    name: Lint + test + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The project is managed with Bun (bun.lock, bunfig.toml).
      # The older workflow used `npm ci` which broke on every dep add
      # because Bun updates `bun.lock`, not package-lock.json.
      # `bun.lock` is the single source of truth.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Format check is enforced (no continue-on-error). After PR 0 lands the
      # tree is prettier-clean and the pre-commit hook keeps it that way, so
      # a red format check means someone committed without the hook
      # installed. The shell wrapper prints an actionable fix on failure
      # rather than leaving a contributor staring at "exit code 1".
      - name: Format check
        run: |
          if ! bun run format:check; then
            echo ""
            echo "::error::Prettier check failed. Run \`bun run format\` locally to fix, then commit. To never see this again on this clone, run \`bash scripts/install-hooks.sh\` once and every commit will auto-format its staged files."
            exit 1
          fi

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  e2e:
    name: E2E (Playwright smoke)
    runs-on: ubuntu-latest
    needs: lint-and-build
    # Bind to the dev environment scope so vars.VITE_SUPABASE_URL,
    # vars.VITE_SUPABASE_PROJECT_ID, etc. resolve to the dev values.
    # The Playwright specs always hit books.orangeway.dev
    # regardless of which branch triggered the workflow, so dev is
    # the right scope on prod pushes too.
    environment: dev
    # Runs on every push to dev or prod. Specs target the dev deployment
    # (books.orangeway.dev). PR events still skip e2e because they
    # deploy to a Cloudflare Pages preview URL, not the dev deployment.
    # Targeting the preview URL on PRs is a follow-up.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/prod')
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Cache Playwright browser binaries between runs — saves ~25s of
      # `playwright install` per run on a cache hit.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lock') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bun run test:e2e:install

      # Runs the full tests/e2e/ directory: flash-flow narrative, the
      # owb-full-suite (auth + nav across every OWB surface), and the
      # OR import wizard spec. The wizard spec auto-skips when its
      # OWB_DEV_E2E_* env vars aren't set, so this is safe on forks /
      # external PRs that don't have the secrets.
      - name: Run Playwright
        run: bunx playwright test
        env:
          PLAYWRIGHT_BASE_URL: https://books.orangeway.dev
          OWB_DEV_E2E_EMAIL: ${{ secrets.OWB_DEV_E2E_EMAIL }}
          OWB_DEV_E2E_PASSWORD: ${{ secrets.OWB_DEV_E2E_PASSWORD }}
          OWB_DEV_E2E_VAULT_PASSWORD: ${{ secrets.OWB_DEV_E2E_VAULT_PASSWORD }}
          # Project-ref values that the e2e specs need to hit the live
          # dev Supabase project. Sourced from the same dev env-vars the
          # frontend build uses, so there is one place to rotate them.
          OWB_E2E_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          OWB_E2E_ALLOWED_PROJECT_REFS: ${{ vars.VITE_SUPABASE_PROJECT_ID }}

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            tests/e2e/__or-shots__/
          retention-days: 14
